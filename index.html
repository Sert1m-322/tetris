<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <link rel="stylesheet" href="tetris.css">
</head>
<body>

    <div class="wrapper">
        <canvas id="game" width="400" height="800"></canvas>
    
        <div class="next-block">
            <p class="text">Next:</p>
            <canvas id="next" width="160" height="200"></canvas>
            <p class="text points">Score:</p>
            <p class="text best">Best:</p>
            <p class="text speed">Speed in ms:</p>
        </div>
    </div>
    <script src="tetris.js"></script>
</body>
</html>
